# =============================================================
# VPN Benchmark - parametres de mesure
# Tout ce qui est ajustable sans toucher au code est ici.
# =============================================================

providers:
  nordvpn:
    label: NordVPN
    gluetun_provider: nordvpn
    port_forwarding: false        # NordVPN ne fait pas de port forwarding
  protonvpn:
    label: ProtonVPN
    gluetun_provider: protonvpn
    port_forwarding: true         # NAT-PMP supporte par gluetun

# --- Modes d'execution ---------------------------------------
modes:
  smoke:
    rounds: 1
    interval_seconds: 0
    countries: [Netherlands]
    servers_per_country: 1
    include_baseline: true
    latency_count: 15
    throughput_seconds: 8
    throughput_streams: 8
    web_repeats: 2
    p2p_every_rounds: 1
    p2p_minutes: 3
    killswitch_test: true

  # Verification rapide : tente une connexion par provider et par pays, et
  # affiche l'IP de sortie obtenue. Aucune mesure, ~2 min. A lancer en premier
  # pour valider que les deux cles fonctionnent sur les pays vises.
  preflight:
    rounds: 1
    interval_seconds: 0
    countries: [Netherlands, Switzerland, Sweden, France]
    servers_per_country: 1
    include_baseline: false
    latency_count: 5
    throughput_seconds: 3
    throughput_streams: 4
    web_repeats: 1
    p2p_every_rounds: 0
    p2p_minutes: 0
    killswitch_test: false

  # Une passe complete sur plusieurs pays : les DEUX providers sont mesures
  # sur exactement la meme liste de pays, avec toute la batterie de tests.
  # Un pays ou un seul des deux se connecte est exclu du score et signale.
  # Compter ~15 min par pays et par provider. Le test torrent, lui, ne tourne
  # que sur les p2p_max_countries premiers pays : il coute 2x p2p_minutes chez
  # Proton (bras temoin sans port forwarding) et n'apprend rien de plus a etre
  # rejoue dans chaque pays.
  multi:
    rounds: 1
    interval_seconds: 0
    countries: [Netherlands, Switzerland, Sweden, France]
    servers_per_country: 1
    include_baseline: true
    latency_count: 25
    throughput_seconds: 10
    throughput_streams: 8
    web_repeats: 2
    p2p_every_rounds: 1
    p2p_minutes: 5
    p2p_max_countries: 1
    killswitch_test: true

  full:
    rounds: 24                    # 24 rounds x 1h = ~24h
    interval_seconds: 3600        # temps minimum entre 2 debuts de round
    countries: [Netherlands, Switzerland, Sweden]
    servers_per_country: 2
    include_baseline: true
    latency_count: 30
    throughput_seconds: 12
    throughput_streams: 8
    web_repeats: 3
    p2p_every_rounds: 4           # test torrent 1 round sur 4 (couteux)
    p2p_minutes: 8
    p2p_max_countries: 1          # sinon un round P2P deborde l'intervalle
    killswitch_test: true

# --- Cibles de mesure ----------------------------------------
targets:
  ping:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
  web:
    - https://www.cloudflare.com/
    - https://www.wikipedia.org/
    - https://github.com/
    - https://www.reddit.com/
  # Cibles de debit descendant : gros fichiers statiques. La campagne en choisit
  # une au demarrage (la plus rapide joignable) et la garde pour tous les cas,
  # sinon la comparaison entre providers ne voudrait rien dire.
  # Cloudflare est en dernier : il repond 429 puis 403 si on l'interroge trop.
  download:
    - https://proof.ovh.net/files/1Gb.dat
    - https://fsn1-speed.hetzner.com/1GB.bin
    - https://hel1-speed.hetzner.com/1GB.bin
    - http://speedtest.tele2.net/1GB.zip
    - https://speed.cloudflare.com/__down?bytes=1000000000
  # Serveurs iperf3 publics (optionnel, laisser vide pour desactiver)
  iperf3: []
  #  - {host: speedtest.serverius.net, port: 5002}

# --- P2P / torrent -------------------------------------------
p2p:
  enabled: true
  # Torrents legaux, bien seedes. Remplacer par une version courante si 404.
  torrents:
    - https://releases.ubuntu.com/24.04/ubuntu-24.04.3-desktop-amd64.iso.torrent
  # Coupe le telechargement au-dela de ce volume (Go) pour ne pas exploser le quota
  max_download_gb: 4
  # Test A/B du port forwarding : rejoue le meme torrent, sur le meme serveur,
  # NAT-PMP coupe. Seuls les providers qui ont port_forwarding: true sont
  # concernes (ProtonVPN). Double la duree du test P2P.
  port_forward_ab: true
  qbittorrent_image: linuxserver/qbittorrent:latest

# --- Ponderation du score final (total libre, normalise ensuite)
scoring:
  weights:
    throughput_down_mbps: 18
    throughput_up_mbps: 10
    latency_avg_ms: 12
    jitter_ms: 6
    packet_loss_pct: 6
    loaded_latency_delta_ms: 8    # bufferbloat
    web_ttfb_ms: 6
    connect_seconds: 4
    success_rate_pct: 10
    p2p_down_mbps: 10
    p2p_up_mbps: 4
    p2p_incoming_peers: 5
    port_forward_ok: 8
    leak_count: 12
  # Sens de lecture: true = plus c'est haut mieux c'est
  higher_is_better:
    throughput_down_mbps: true
    throughput_up_mbps: true
    latency_avg_ms: false
    jitter_ms: false
    packet_loss_pct: false
    loaded_latency_delta_ms: false
    web_ttfb_ms: false
    connect_seconds: false
    success_rate_pct: true
    p2p_down_mbps: true
    p2p_up_mbps: true
    p2p_incoming_peers: true
    port_forward_ok: true
    leak_count: false

# --- Divers ---------------------------------------------------
runtime:
  gluetun_ready_timeout: 120      # secondes avant d'abandonner une connexion
  probe_timeout: 240
  between_cases_seconds: 5
