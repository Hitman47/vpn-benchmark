# =============================================================================
# Stack Portainer - VPN Benchmark (NordVPN vs ProtonVPN)
#
# Variante "image publiee" : a coller dans Portainer > Stacks > Add stack >
# Web editor. Aucune construction sur le NAS, l'image est tiree du registre.
#
# Prerequis : avoir publie l'image une fois depuis ton PC (voir publish.ps1)
# et remplacer BENCH_IMAGE ci-dessous par ton tag.
# =============================================================================
services:
  vpnbench:
    # image publiee : remplace la valeur par defaut par ton tag
    image: ${BENCH_IMAGE:-ghcr.io/CHANGE-MOI/vpn-benchmark:latest}
    container_name: vpnbench-orchestrator   # ne pas renommer : le conteneur s'auto-inspecte
    environment:
      # --- obligatoire ------------------------------------------------------
      NORD_WIREGUARD_PRIVATE_KEY: ${NORD_WIREGUARD_PRIVATE_KEY}
      PROTON_WIREGUARD_PRIVATE_KEY: ${PROTON_WIREGUARD_PRIVATE_KEY}
      # --- environnement ----------------------------------------------------
      PROTON_WIREGUARD_ADDRESSES: ${PROTON_WIREGUARD_ADDRESSES:-10.2.0.2/32}
      LAN_SUBNET: ${LAN_SUBNET:-192.168.1.0/24}
      TZ: ${TZ:-Europe/Paris}
      GLUETUN_IMAGE: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.40}
      # --- campagne ---------------------------------------------------------
      BENCH_MODE: ${BENCH_MODE:-smoke}          # smoke | full | report
      BENCH_COUNTRIES: ${BENCH_COUNTRIES:-}     # ex: Netherlands,Switzerland,Sweden
      BENCH_ROUNDS: ${BENCH_ROUNDS:-}
      BENCH_INTERVAL_MINUTES: ${BENCH_INTERVAL_MINUTES:-}
      BENCH_SERVERS_PER_COUNTRY: ${BENCH_SERVERS_PER_COUNTRY:-}
      BENCH_P2P_ENABLED: ${BENCH_P2P_ENABLED:-}
      BENCH_P2P_MINUTES: ${BENCH_P2P_MINUTES:-}
      BENCH_P2P_EVERY_ROUNDS: ${BENCH_P2P_EVERY_ROUNDS:-}
      BENCH_MAX_DOWNLOAD_GB: ${BENCH_MAX_DOWNLOAD_GB:-}
      BENCH_THROUGHPUT_SECONDS: ${BENCH_THROUGHPUT_SECONDS:-}
      BENCH_THROUGHPUT_STREAMS: ${BENCH_THROUGHPUT_STREAMS:-}
      BENCH_KILLSWITCH: ${BENCH_KILLSWITCH:-}
      BENCH_HTTP_PORT: 8888
    ports:
      # rapport HTML consultable au navigateur : http://<ip-du-nas>:8888/
      - "${BENCH_WEB_PORT:-8888}:8888"
    volumes:
      # requis : l'orchestrateur cree et detruit les conteneurs gluetun/sonde
      - /var/run/docker.sock:/var/run/docker.sock
      - results:/app/results        # base SQLite, CSV, report.html
      - auth:/shared/auth           # config d'auth du control server gluetun
      - qbt:/shared/qbt             # config qBittorrent generee
      - downloads:/shared/downloads # telechargements du test P2P (vides apres)
    restart: on-failure:3

volumes:
  results:
  auth:
  qbt:
  downloads:
