# =============================================================================
# Stack Portainer - VPN Benchmark (NordVPN vs ProtonVPN)
#
# L'image est publiee sur GitHub Container Registry par GitHub Actions a chaque
# push sur main. Rien n'est construit sur le NAS.
#
# Portainer > Stacks > Add stack > Web editor : colle ce fichier, renseigne les
# variables d'environnement, deploie.
# Ou via Repository : URL du depot, compose path docker-compose.yml,
# "Pull latest image" ACTIVE pour recuperer la derniere image publiee.
# =============================================================================
services:
  vpnbench:
    image: ${BENCH_IMAGE:-ghcr.io/hitman47/vpn-benchmark:latest}
    pull_policy: always
    container_name: vpnbench-orchestrator   # ne pas renommer : le conteneur s'auto-inspecte
    environment:
      # --- obligatoire ------------------------------------------------------
      NORD_WIREGUARD_PRIVATE_KEY: ${NORD_WIREGUARD_PRIVATE_KEY}
      PROTON_WIREGUARD_PRIVATE_KEY: ${PROTON_WIREGUARD_PRIVATE_KEY}
      # --- environnement ----------------------------------------------------
      PROTON_WIREGUARD_ADDRESSES: ${PROTON_WIREGUARD_ADDRESSES:-10.2.0.2/32}
      LAN_SUBNET: ${LAN_SUBNET:-192.168.1.0/24}
      TZ: ${TZ:-Europe/Paris}
      GLUETUN_IMAGE: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.40}
      BENCH_GLUETUN_LOG_LEVEL: ${BENCH_GLUETUN_LOG_LEVEL:-info}  # debug|info|warning|error - pas le mode de campagne
      # --- campagne ---------------------------------------------------------
      BENCH_MODE: ${BENCH_MODE:-smoke}          # preflight | smoke | multi | full | report
      BENCH_COUNTRIES: ${BENCH_COUNTRIES:-}     # ex: Netherlands,Switzerland,Sweden
      BENCH_ROUNDS: ${BENCH_ROUNDS:-}
      BENCH_INTERVAL_MINUTES: ${BENCH_INTERVAL_MINUTES:-}
      BENCH_SERVERS_PER_COUNTRY: ${BENCH_SERVERS_PER_COUNTRY:-}
      BENCH_P2P_ENABLED: ${BENCH_P2P_ENABLED:-}
      BENCH_P2P_MINUTES: ${BENCH_P2P_MINUTES:-}
      BENCH_PF_AB: ${BENCH_PF_AB:-}
      BENCH_P2P_EVERY_ROUNDS: ${BENCH_P2P_EVERY_ROUNDS:-}
      BENCH_P2P_MAX_COUNTRIES: ${BENCH_P2P_MAX_COUNTRIES:-}
      BENCH_MAX_DOWNLOAD_GB: ${BENCH_MAX_DOWNLOAD_GB:-}
      BENCH_THROUGHPUT_SECONDS: ${BENCH_THROUGHPUT_SECONDS:-}
      BENCH_THROUGHPUT_STREAMS: ${BENCH_THROUGHPUT_STREAMS:-}
      BENCH_LATENCY_COUNT: ${BENCH_LATENCY_COUNT:-}
      BENCH_WEB_REPEATS: ${BENCH_WEB_REPEATS:-}
      BENCH_KILLSWITCH: ${BENCH_KILLSWITCH:-}
      BENCH_INCLUDE_BASELINE: ${BENCH_INCLUDE_BASELINE:-}
      # --- cibles de mesure (listes separees par des virgules) ---------------
      BENCH_PING_TARGETS: ${BENCH_PING_TARGETS:-}
      BENCH_WEB_URLS: ${BENCH_WEB_URLS:-}
      BENCH_DOWNLOAD_URLS: ${BENCH_DOWNLOAD_URLS:-}
      BENCH_TORRENTS: ${BENCH_TORRENTS:-}
      # --- interne ----------------------------------------------------------
      BENCH_HTTP_PORT: 8888                     # port dans le conteneur
      BENCH_KEEP_ALIVE: ${BENCH_KEEP_ALIVE:-true}  # false = le conteneur s'arrete a la fin
    ports:
      # rapport HTML consultable au navigateur : http://<ip-du-nas>:8888/
      - "${BENCH_WEB_PORT:-8888}:8888"
    volumes:
      # requis : l'orchestrateur cree et detruit les conteneurs gluetun/sonde
      - /var/run/docker.sock:/var/run/docker.sock
      - results:/app/results        # base SQLite, CSV, report.html
      - auth:/shared/auth           # config d'auth du control server gluetun
      - qbt:/shared/qbt             # config qBittorrent generee
      # BENCH_DOWNLOADS_PATH=/chemin/sur/le/nvme pour sortir les
      # telechargements P2P du disque systeme. Non renseigne, ils vont dans un
      # volume Docker (donc sur le disque systeme du NAS).
      - ${BENCH_DOWNLOADS_PATH:-downloads}:/shared/downloads # telechargements du test P2P (vides apres)
      # facultatif : deposer un bench.yaml personnalise dans ce volume pour
      # surcharger celui embarque dans l'image (poids du score, cibles, etc.)
      # - config:/config
    restart: on-failure:3

volumes:
  results:
  # config:
  auth:
  qbt:
  downloads:
